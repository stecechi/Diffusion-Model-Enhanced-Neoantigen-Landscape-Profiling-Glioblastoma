[build-system]
requires = ["setuptools==69.2.0", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffneoscore"
version = "0.1.0"
description = "Population-aware peptide-MHC structural and sequence scoring"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.2.2", "numpy==1.26.4", "scipy==1.12.0", "scikit-learn==1.4.2", "lifelines==0.28.0"]

[project.scripts]
diffneoscore = "diffneoscore.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
line-length = 320
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["diffneoscore"]
mypy_path = "code"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "no-untyped-call"]
